<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101828" />
    <meta name="description" content="Know which New Jersey town and county you're in, which way you're heading, and practice the map." />
    <title>NJ Townfinder</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="lib/maplibre-gl.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-mode="drive">
    <div id="map" aria-label="Map of New Jersey municipalities"></div>

    <div id="edges" aria-hidden="true">
      <span data-d="0" class="n">N</span><span data-d="90">E</span><span data-d="180">S</span><span data-d="270">W</span>
    </div>

    <header id="hud" aria-live="polite" hidden></header>

    <div id="fabs">
      <button id="compass" class="fab" title="Toggle north-up / heading-up" aria-label="Toggle map orientation">
        <svg class="rose" viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#fff" stroke="#101828" stroke-width="2" />
          <path d="M24 5 L30 24 L24 21 L18 24 Z" fill="#dc2626" />
          <path d="M24 43 L30 24 L24 27 L18 24 Z" fill="#98a2b3" />
        </svg>
        <span class="fab-label orient-label"></span>
      </button>
      <button id="recenter" class="fab" title="Follow my location" aria-label="Recenter on my location">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="#2563eb" />
          <circle cx="12" cy="12" r="8" fill="none" stroke="#101828" stroke-width="2" />
          <path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="#101828" stroke-width="2" />
        </svg>
      </button>
    </div>

    <div id="toast" role="status" hidden></div>

    <section id="sheet" hidden></section>

    <nav id="tabs" role="tablist">
      <button role="tab" data-mode="drive"><span class="ti">◉</span>Drive</button>
      <button role="tab" data-mode="explore"><span class="ti">⌕</span>Explore</button>
      <button role="tab" data-mode="practice"><span class="ti">✎</span>Practice</button>
      <button id="settingsBtn" aria-label="Settings"><span class="ti">⚙</span>Settings</button>
    </nav>

    <dialog id="settings">
      <h2>Settings</h2>
      <label class="row"><input type="checkbox" data-setting="voice" /> Speak when I cross into a new town</label>
      <label class="row sub"><input type="checkbox" data-setting="voiceHints" /> …and name its sound-alike (“Not Rockaway — that's 19 miles west-northwest”)</label>
      <label class="row"><input type="checkbox" data-setting="northUp" /> North-up map while driving (off = map turns with you)</label>
      <label class="row"><input type="checkbox" data-setting="driveLabels" /> Show town names on the map while driving</label>
      <label class="row"><input type="checkbox" data-setting="wakeLock" /> Keep screen on while tracking</label>
      <label class="row"><input type="checkbox" data-setting="phoneCompass" /> Use phone compass for heading when stopped</label>
      <label class="row">Background map
        <select data-setting="basemap">
          <option value="streets">Streets</option>
          <option value="light">Light</option>
          <option value="none">None (works offline)</option>
        </select>
      </label>
      <div class="btnrow">
        <button id="stopTracking">Stop location</button>
        <button id="resetStats">Clear practice scores</button>
        <button id="resetVisited">Forget visited towns</button>
      </div>
      <p class="fine">
        Town boundaries: NJ Office of GIS, Municipal Boundaries of NJ (564 municipalities). Background map © OpenStreetMap
        contributors, © CARTO. Your location and scores are stored only on this device.
      </p>
      <button class="primary" id="closeSettings">Done</button>
    </dialog>

    <script src="lib/maplibre-gl.js"></script>
    <script src="lib/topojson-client.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
