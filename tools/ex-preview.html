<!-- Every "How it works" explainer in Deep Jersey, every step, on one page: open /tools/ex-preview.html from the local server to check the drawings. -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../css/app.css"><style>html,body{height:auto!important;overflow:visible!important;position:static!important} body{background:#fff;font:13px system-ui;margin:8px} .g{display:grid;grid-template-columns:repeat(4,260px);gap:8px} figure{margin:0} p{margin:2px 0 6px;font-size:11px;line-height:1.3} h3{margin:10px 0 4px}</style>
<div id=o></div><script type=module>
import { EXPLAIN } from '../js/deepexplain.js';
document.getElementById('o').innerHTML = Object.entries(EXPLAIN).map(([k,X]) => `<h3>${X.title}</h3><div class=g>${X.steps.map(s=>`<figure>${s.draw}<p>${s.text}</p></figure>`).join('')}</div>`).join('');
</script>
